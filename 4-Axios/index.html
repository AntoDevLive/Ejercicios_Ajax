<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css">
    <title>4-axios</title>
  </head>
  <body>
    <div class="container">
        
        <!-- Tabla -->
        <section class="section-card">
            <div class="section-header">
                <h2><i class="fa-solid fa-users"></i> Listado de Usuarios</h2>
                <p>Visualiza y gestiona los usuarios registrados en el sistema.</p>
            </div>
            
            <div class="table-container">
                <table class="custom-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Apellido</th>
                            <th>Email</th>
                            <th>Teléfono</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Los datos se inyectarán dinámicamente aquí -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Formulario -->
        <section class="section-card">
            <div class="section-header">
                <h2><i class="fa-solid fa-user-plus"></i> Registrar Usuario</h2>
                <p>Introduce los datos para dar de alta un nuevo miembro.</p>
            </div>

            <form class="user-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Ej. Ana" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="apellido">Apellido</label>
                        <input type="text" id="apellido" name="apellido" placeholder="Ej. Silva" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" name="email" placeholder="ana@example.com" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="telefono">Teléfono</label>
                        <input type="tel" id="telefono" name="telefono" placeholder="Ej. +34 600 000 000">
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-submit">
                        <i class="fa-solid fa-save"></i> Guardar Usuario
                    </button>
                </div>
            </form>
        </section>

    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
